title: Establish the GraphHopper adapter boundary with mocked tests
summary: Create the first api-layer contract for talking to GraphHopper without requiring real regional data yet.
acceptance_criteria:
  - api contains a dedicated adapter boundary for routing-engine requests
  - mocked tests cover successful and unavailable GraphHopper responses
  - no product logic is scattered directly into route handlers
verification:
  - npm run test
  - npm run typecheck
implementation_notes:
  - "2026-05-13 refine: `apps/api/src/app.ts` currently exposes `/health` only, so the routing-engine boundary still needs to be introduced from scratch."
  - "2026-05-13 implement: Added `apps/api/src/routing/graphhopper-adapter.ts` as the dedicated GraphHopper boundary. It accepts concrete route points plus activity, maps those requests into GraphHopper HTTP calls, normalizes successful route data, and throws dedicated unavailable or invalid-response errors instead of leaking raw fetch behavior."
  - "2026-05-13 implement: Added `apps/api/src/routing/graphhopper-adapter.test.ts` with mocked GraphHopper HTTP coverage for successful responses, unavailable responses, and malformed payload handling."
  - "2026-05-13 implement: Added `exports` and `types` entries to `packages/shared/package.json` so API-side imports of the shared contract package resolve cleanly in Vitest and future runtime code."
  - "2026-05-13 implement: Verified with `npm run test`, `npm run typecheck`, and `npm run verify` after sourcing the repository shell bootstrap instructions."
