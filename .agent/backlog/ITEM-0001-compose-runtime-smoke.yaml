title: Enable a real compose runtime smoke for the scaffolded web and api services
summary: Replace the current config-only compose verification with a repeatable runtime smoke that proves the scaffolded api and web containers boot cleanly.
acceptance_criteria:
  - npm run compose:test can bring up and tear down the scaffolded web and api services
  - the smoke test checks at least one healthy signal from the api container
  - documentation explains what is and is not covered before maps-profile services are ready
verification:
  - npm run compose:test
implementation_notes:
  - "2026-05-13 refine: apps/api already exposes `/health`, but `scripts/test-compose.sh` still stops after `docker compose config` unless `PATHBADGER_RUNTIME_SMOKE=1` is set."
  - "2026-05-13 implement: `scripts/test-compose.sh` now always builds and starts the scaffolded `api` and `web` services, waits for both containers to stay running, verifies the api `/health` response from inside the container, and tears the stack down automatically."
  - "2026-05-13 implement: Docker image installs now use `npm ci --ignore-scripts` so workspace dependencies can be installed in containers without trying to run the local `lefthook install` prepare hook. A new `.dockerignore` also trims the compose build context."
  - "2026-05-13 implement: Verified with `npm run compose:test` and `npm run verify`. No separate unit test was added because this item's acceptance criteria are exercised directly by the runtime smoke command."
