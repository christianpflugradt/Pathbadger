title: Normalize GraphHopper instructions into route preview responses
summary: Request and normalize GraphHopper turn instructions so successful route previews can return minimal execution cues through the shared response contract.
acceptance_criteria:
  - GraphHopper adapter requests instruction data instead of forcing `instructions=false`
  - adapter and route-generation service map instruction data into the shared response contract without leaking raw GraphHopper instruction shapes
  - mocked api tests cover successful instruction mapping and empty-instruction fallback behavior
verification:
  - npm run test
  - npm run typecheck
  - npm run verify
implementation_notes:
  - "2026-05-13 refine: `apps/api/src/routing/graphhopper-adapter.ts` currently disables GraphHopper instructions entirely, so no navigation cue data can reach the web app."
  - "2026-05-13 implement: Updated `apps/api/src/routing/graphhopper-adapter.ts` to request GraphHopper instructions, validate the raw instruction payload, and normalize it into the shared route instruction contract with distance-from-start, distance-to-next, type, text, street name, and geometry-backed coordinates."
  - "2026-05-13 implement: Threaded normalized instructions through `routed-candidate-scoring.ts` and `route-generation-service.ts` so successful and partial route previews now return instruction arrays while failed previews still return `instructions: null`."
  - "2026-05-13 implement: Expanded mocked api coverage in `graphhopper-adapter.test.ts`, `route-generation-service.test.ts`, and `routed-candidate-scoring.test.ts` to verify successful instruction mapping, empty-instruction fallback behavior, and invalid instruction interval rejection."
