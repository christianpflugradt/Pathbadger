title: Sync map-selected planning points with the form state
summary: Connect the live planning map to the existing start-point and pass-through controls so map-selected points become real UI state instead of stubbed placeholders.
acceptance_criteria:
  - selecting `Map-selected point` reflects a chosen coordinate on the map and in the request preview
  - pass-through points can be added from map interaction while preserving the existing list and remove controls
  - non-map start modes still work without coupling navigation or route-generation logic into the planner
verification:
  - npm run lint
  - npm run typecheck
  - npm run verify
implementation_notes:
  - "2026-05-13 refine: `apps/web/src/App.tsx` currently uses hard-coded waypoint drafts, so the map-selected start and pass-through flows are still illustrative only."
  - "2026-05-13 refine: `apps/web/src/PlanningMap.tsx` now mounts the live MapLibre surface, so the smallest next step is to let map interaction produce real planning coordinates instead of keeping `map_point` and pass-through entries on hard-coded placeholders."
  - "2026-05-13 implement: Replaced the hard-coded map point drafts with live map interaction state. When `Map-selected point` is active, clicking the planning map now updates the route start coordinate and request preview directly."
  - "2026-05-13 implement: Added an explicit `Add next map click` pass-through mode so the next map click appends a removable waypoint without coupling navigation or route-generation behavior into the planner."
  - "2026-05-13 implement: Extended `PlanningMap.tsx` with map click handling, start and waypoint markers, interaction status copy, and cursor changes so the live map both reflects and drives the planner state."
  - "2026-05-13 implement: Verified with `npm run lint`, `npm run typecheck`, `npm run verify`, and an in-app browser pass. The browser check confirmed that a map click changed the start coordinate, an armed next click added `Map waypoint 1`, and switching to `Remembered default` kept idle map clicks from mutating the request."
