title: Generate deterministic candidate waypoint seeds from a planning request
summary: Create the first backend helper that turns a route-planning request into one or more deterministic round-trip-friendly waypoint sets so later GraphHopper orchestration has honest candidate inputs.
acceptance_criteria:
  - backend exports a candidate seed helper that derives waypoint sets from start, target distance, pass-through points, and random seed
  - the same request and random seed produce the same candidate output
  - optional pass-through points are preserved in candidate ordering without inventing navigation state
verification:
  - npm run test
  - npm run typecheck
  - npm run verify
implementation_notes:
  - "2026-05-13 refine: `apps/api` has a GraphHopper adapter but still lacks any route-generation helper that can turn a planning request into candidate waypoint sets for round-trip routing."
  - "2026-05-13 implement: Added `apps/api/src/routing/candidate-waypoint-seeds.ts` as the first deterministic candidate-generation helper. It parses the shared planning request, resolves a stable seed, derives round-trip-friendly loop waypoints from target distance, and returns two candidate point lists for later GraphHopper orchestration."
  - "2026-05-13 implement: Candidate output keeps optional pass-through points in-order inside every generated point list and falls back to a deterministic derived seed when the request does not provide one."
  - "2026-05-13 implement: Added `apps/api/src/routing/candidate-waypoint-seeds.test.ts` to verify same-request determinism, pass-through ordering preservation, and deterministic fallback behavior for null random seeds."
  - "2026-05-13 implement: Verified with `npm run test`, `npm run typecheck`, and `npm run verify`."
