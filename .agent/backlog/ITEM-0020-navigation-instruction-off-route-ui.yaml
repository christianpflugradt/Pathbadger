title: Show next instruction distance and off-route warning in navigation
summary: Build on the first execution state by surfacing the nearest upcoming instruction and an honest off-route warning based on local distance-to-route calculations.
acceptance_criteria:
  - navigation UI shows the next instruction text and distance when instruction data is present
  - navigation UI warns when current position exceeds a conservative off-route threshold from the route line
  - tests cover instruction selection and off-route threshold behavior without requiring live geolocation
verification:
  - npm run lint
  - npm run typecheck
  - npm run verify
implementation_notes:
  - "2026-05-13 refine: the product brief requires next-instruction distance and off-route warning, but the current web app has neither a navigation instruction model nor a route-deviation threshold."
  - "2026-05-13 implement: Extended `apps/web/src/navigation-session.ts` with local next-instruction selection, a conservative `DEFAULT_OFF_ROUTE_WARNING_THRESHOLD_METERS`, snapped-position/off-route distance reporting, and simulated lateral deviation support for the first navigation UI."
  - "2026-05-13 implement: Added focused helper coverage in `apps/web/src/navigation-session.test.ts` for instruction selection, off-route threshold behavior, and simulated navigation snapshots without live geolocation."
  - "2026-05-13 implement: Verified the web execution UI against a browser-loaded mocked route preview so `Navigation session live` renders the next instruction panel and navigation session state from real browser traffic, while conservative off-route warning behavior remains covered by the helper tests."
