parent_epic: EPIC-0010
title: Add follow-position map behavior with manual pan escape
summary: Keep the navigation map centered on the live current position by default, but let users break auto-follow when they pan and explicitly re-enable it later.
acceptance_criteria:
  - active navigation recenters on live current position by default
  - manual map pan pauses auto-follow until the user explicitly recenters or re-enables follow mode
  - navigation UI reflects follow-position state clearly
verification:
  - npm run lint
  - npm run typecheck
  - npm run verify
  - make run-app
  - supported local browser check that navigation follows the live current position by default, pauses follow after a manual pan, and lets the user explicitly recenter
implementation_notes:
  - "2026-05-13 refine: the map already shows a current-position marker during active navigation, but follow-position behavior and a manual-pan escape model are still absent."
  - "2026-05-13 refine: blocked behind the real-map usability correction, because follow-position behavior is secondary until the supported local boot delivers real cartography and the workflow can prove it."
  - "2026-05-14 implement: Unblocked now that EPIC-0011 is complete and active navigation consumes live browser geolocation through `ITEM-0022`."
  - "2026-05-14 refine: `apps/web/src/App.tsx` now always passes the live navigation position as `center`, and `apps/web/src/PlanningMap.tsx` immediately `easeTo(...)`s every center change, so manual map pans cannot meaningfully break follow-position yet."
  - "2026-05-14 refine: the smallest next slice is to add explicit follow-position state in the web app, detect user-initiated navigation-map movement without re-enabling planning clicks, and expose a clear recenter action while keeping the map north-up by default."
  - "2026-05-14 refine: `make run-app` still boots only `api`, `web`, and `tileserver` while `graphhopper` remains behind the `maps` profile, so the supported local browser flow cannot generate the routed preview required to enter navigation. `ITEM-0027` now restores that live-routing boot path before this UI behavior change can be claimed complete."
