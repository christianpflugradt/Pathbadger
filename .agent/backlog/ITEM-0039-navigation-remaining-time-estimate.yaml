title: Surface estimated remaining time when navigation data is good enough
summary: Combine the existing remaining-distance and speed metrics into an explicit estimated remaining time readout during navigation, while keeping the estimate unavailable when live speed or progress evidence is too weak to justify it.
acceptance_criteria:
  - the navigation session surfaces estimated remaining time when current or average speed plus route-progress data support a defensible estimate
  - the execution UI keeps the estimate explicitly unavailable when speed or route-progress data is too sparse, stale, or low-confidence
  - tests cover representative estimate-available and estimate-unavailable scenarios without relying on ad hoc live GPS behavior
verification:
  - npm run verify
  - supported local browser walkthrough showing estimated remaining time visible or honestly unavailable in navigation
implementation_notes:
  - "2026-05-14 refine: `apps/web/src/navigation-session.ts` already computes `remainingDistanceMeters`, and `apps/web/src/navigation-speed-state.ts` already derives current and average speed, but `App.tsx` does not yet combine them into the estimated remaining time called out in the product brief."
  - "2026-05-14 refine: `docs/product.md` section 4.2 describes estimated remaining time as part of the route-execution state when feasible, making this a grounded follow-up that reuses current local navigation calculations instead of demanding a new backend dependency."
  - "2026-05-14 refine: low-confidence or stale GPS handling is already explicit in the navigation UI, so this estimate should key off the same honesty rules rather than manufacturing a precise ETA from weak browser data."
  - "2026-05-14 implement: added `apps/web/src/navigation-eta-state.ts` and deterministic tests so ETA selection stays centralized, preferring timestamped average route progress when available, falling back to a fresh live speed sample when needed, and refusing to estimate when GPS freshness, confidence, or speed evidence is weak."
  - "2026-05-14 implement: updated `apps/web/src/App.tsx` to surface `Est. remaining time` in the active navigation card, including an explicit unavailable state before route progress exists and helper copy that explains when ETA is based on average pace versus a live speed sample."
  - "2026-05-14 implement: verified with focused ETA tests, `npm run verify`, and a supported local browser walkthrough on `make run-routing-app`, where the live session surfaced `Est. remaining time: Unavailable` plus honest fallback copy while desktop browser geolocation permission was unavailable."
