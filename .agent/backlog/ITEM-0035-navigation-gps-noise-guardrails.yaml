title: Add conservative guardrails for noisy live GPS fixes
summary: Use browser accuracy data and recency thresholds to keep active navigation honest when the live geolocation feed is too noisy or low-confidence to trust for precise off-route or progress updates.
acceptance_criteria:
  - navigation distinguishes fresh high-confidence fixes from noisy or low-confidence browser positions instead of treating every `ready` update as equally precise
  - low-confidence fixes avoid overreacting in off-route or progress UI and surface explicit copy about reduced confidence
  - automated coverage proves the guardrail behavior with deterministic mocked geolocation states rather than relying only on ad hoc browser trials
verification:
  - npm run verify
  - supported local browser navigation check showing low-confidence GPS copy or state without pretending precision
implementation_notes:
  - "2026-05-14 refine: `apps/web/src/browser-geolocation.ts` already normalizes `accuracyMeters`, but the current navigation tracking state and execution UI do not yet use that field to distinguish trustworthy fixes from noisy ones."
  - "2026-05-14 refine: `docs/product.md` section 20B.2 explicitly calls for using accuracy data to avoid overreacting to noisy GPS, making this the first hardening item with direct product backing and a narrow write scope in the web runtime."
  - "2026-05-14 implement: added `apps/web/src/navigation-gps-confidence.ts` plus deterministic unit coverage so the web runtime can classify live fixes by accuracy and age instead of treating every `ready` update as equally precise."
  - "2026-05-14 implement: updated `apps/web/src/navigation-tracking-state.ts`, `navigation-follow-state.ts`, and `App.tsx` so low-confidence ready fixes surface explicit conservative copy, downgrade progress and route-deviation cues to approximate guidance, and stop escalating a hard off-route warning until a tighter update arrives."
  - "2026-05-14 implement: updated `docs/navigation.md` so the supported navigation flow now documents conservative handling for noisy or stale live GPS fixes."
  - "2026-05-14 implement: verified the item with `npm run verify` and the supported `make run-app` browser flow, confirming the live app renders the new GPS guardrail summary copy in the navigation card."
