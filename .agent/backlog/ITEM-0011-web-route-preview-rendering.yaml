title: Submit planning requests and render routed preview state in the web app
summary: Connect the planner controls to the backend route-generation boundary so the live map can later show routed geometry, warnings, and summary data instead of a request JSON preview only.
acceptance_criteria:
  - generate route and variation actions call the backend instead of updating shell-only counters
  - web app renders routed preview warnings or summary state from the shared response contract
  - map preview is ready to render routed geometry without mixing navigation-only state into the planner
verification:
  - npm run lint
  - npm run typecheck
  - npm run verify
implementation_notes:
  - "2026-05-13 refine: `apps/web/src/App.tsx` still updates local shell state only for generate-route actions and does not consume any backend route response yet."
  - "2026-05-13 implement: Added `apps/web/src/route-preview-client.ts` plus tests so the planner can call `POST /routes/generate` through `PUBLIC_API_BASE_URL`, validate the shared response contract, and surface request failures honestly."
  - "2026-05-13 implement: Reworked `apps/web/src/App.tsx` to replace shell-only variation counters with real route-preview request state, including candidate tracking, stale-preview cues, warning rendering, summary cards, and raw request/response inspection panels."
  - "2026-05-13 implement: Updated `apps/web/src/PlanningMap.tsx` to render returned route geometry as a MapLibre overlay and added local browser verification against live `api` and `web` containers, confirming `Generate route` and `Generate variation` both hit the backend preview boundary."
