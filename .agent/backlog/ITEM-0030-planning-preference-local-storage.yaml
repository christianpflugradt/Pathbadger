  - selected activity persists across browser reloads
  - selected surface preference persists across browser reloads
  - storage failures leave the planner usable and surface honest fallback behavior instead of crashing
verification:
  - npm run verify
  - make run-app
  - supported local browser reload check that activity and surface selections are restored from local storage
implementation_notes:
