title: Render routed surface composition in the planner preview
summary: Extend the web preview panel so it presents surfaced percentage breakdowns and unknown-coverage messaging once the backend returns honest route surface summary data.
acceptance_criteria:
  - planner preview renders available surface percentages from the shared route summary in a readable format
  - failed or partial previews still communicate missing or unknown surface data clearly without implying precision the backend did not provide
  - browser verification confirms the preview UI can show richer surface details without breaking map rendering or variation requests
verification:
  - npm run lint
  - npm run typecheck
  - npm run verify
implementation_notes:
  - "2026-05-13 refine: `apps/web/src/App.tsx` currently shows distance, elevation, status, and warning count, but it does not render any surface composition values from `RouteGenerateResponse.summary.surface`."
  - "2026-05-13 refine: keeping the web rendering as a separate follow-up item preserves a clear adapter-first, scoring-second, UI-third sequence for the remaining route-generation work."
  - "2026-05-13 implement: Added `apps/web/src/route-surface-summary.ts` plus focused tests to turn shared response summaries into readable surface cards and honest coverage messaging for full, partial, or missing route surface data."
  - "2026-05-13 implement: Updated `apps/web/src/App.tsx` and `apps/web/src/styles.css` to render a dedicated surface-composition section in the routed preview panel, including percentage cards and simple meter bars for asphalt, trail/unpaved, track/path/other, and unknown coverage."
  - "2026-05-13 implement: Verified the live page with mocked browser-side preview responses after `./scripts/dev-up.sh`, confirming that `Generate route` and `Generate variation` both update the new surface section while the MapLibre surface remains mounted."
