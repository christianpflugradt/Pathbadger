title: Persist the last used planning start locally
summary: Replace the fake `Last used start` mode with an honest browser-local record of the most recent non-GPS planning origin.
acceptance_criteria:
  - the planner records the latest non-GPS planning start as a browser-local last-used value
  - "`Last used start` no longer resolves to a hard-coded coordinate when no historical value exists yet"
  - a saved last-used start survives a browser reload and is available for later route generation
verification:
  - npm run verify
  - make run-app
  - supported local browser reload check that the planner restores the last used start honestly after it has been set once
implementation_notes:
  - "2026-05-14 refine: `apps/web/src/App.tsx` currently exposes `last_used` in the same hard-coded start-point catalog as `saved_default`, so the supported planner still advertises fake local memory."
  - "2026-05-14 refine: keeping last-used persistence separate from the explicit default-start save flow should make the implementation and browser verification smaller than a combined storage rewrite."
