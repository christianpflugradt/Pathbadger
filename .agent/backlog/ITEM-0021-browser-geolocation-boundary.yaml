title: Add a reusable browser geolocation boundary for navigation
summary: Introduce a focused web-side geolocation runtime that manages permission, watch lifecycle, and honest unsupported or denied states before live navigation consumes browser position updates.
acceptance_criteria:
  - web exposes a reusable browser geolocation boundary instead of embedding `navigator.geolocation` calls directly in `App.tsx`
  - unsupported, denied, and unavailable geolocation states are surfaced honestly for later planner and navigation UI consumption
  - tests cover normalized position handling and unsupported or denied fallback behavior with mocked browser APIs
verification:
  - npm run lint
  - npm run typecheck
  - npm run verify
implementation_notes:
  - "2026-05-13 refine: active navigation still depends on simulated slider state, so the smallest next slice is a reusable browser geolocation boundary rather than mixing `watchPosition` logic directly into the execution card."
  - "2026-05-13 implement: Added `apps/web/src/browser-geolocation.ts` as the reusable browser-side geolocation boundary, including watch lifecycle management, normalized shared coordinate output, and honest `requesting`, `ready`, `unsupported`, `denied`, and `unavailable` states."
  - "2026-05-13 implement: Wired `apps/web/src/App.tsx` into the new boundary for the Current GPS start mode so the planner shows live geolocation state, pauses route generation until a usable fix exists, and keeps navigation geolocation concerns out of the planning shell."
  - "2026-05-13 implement: Covered normalized position handling plus unsupported and denied fallback behavior in `apps/web/src/browser-geolocation.test.ts`, then verified the UI in the in-app browser where Current GPS position surfaced `Permission denied` and disabled route generation honestly."
