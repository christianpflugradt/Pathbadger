title: Enter a true navigation mode from the route preview
summary: When the user starts navigation, switch from the route preview shell into a dedicated guidance mode that keeps the map and route dominant and removes nonessential planner, preview, and diagnostic chrome.
acceptance_criteria:
  - starting navigation on a phone-sized supported browser viewport transitions directly from the route preview into a dedicated guidance mode on the same map surface
  - during active navigation, the map occupies most of the visible space, roughly 80 percent or more when practical, and the route line plus current position remain comfortably visible
  - planner cards, preview diagnostics, and secondary route-summary chrome do not persist as competing blocks in the active guidance view
  - supported browser verification proves active route following no longer feels like a planner or debug page layered on top of the map
verification:
  - npm run verify
  - make run-app
  - supported phone-sized browser walkthrough for start-navigation transition and map-dominant active guidance
implementation_notes:
  - "2026-05-15 refine: user feedback clarified that the current navigation screen still behaves like a planner or diagnostics shell rather than a dedicated guidance mode."
  - "2026-05-15 refine: the navigation transition must make the route itself feel central immediately, without keeping large route-preview or settings blocks on screen."
  - "2026-05-16 implement: starting navigation now hides the planner header, preview disclosures, and secondary guidance card on phone-sized layouts so the rebuilt app stays on a single map-dominant guidance surface with only the floating HUD and stop/settings controls visible."
  - "2026-05-16 implement: verified on a rebuilt app with a phone-sized in-app browser walkthrough that Weddelbrook defaults still generate a route and the start-navigation transition no longer leaves planner or diagnostics cards competing below the map. The in-app browser still withheld a usable live GPS fix during verification, so the dedicated guidance HUD remained in its explicit waiting-for-GPS state."
