title: Minimize the navigation HUD and restore a quick next-route reset
summary: Keep the phone navigation view map-dominant with only essential turn and progress metrics visible, and provide a clean return to the main planning state when navigation finishes or the user stops it.
acceptance_criteria:
  - during active navigation on a phone-sized supported browser viewport, the map occupies most of the visible space and the persistent HUD is limited to essential cues such as next turn, distance to turn, completed and remaining km, progress percent, and speed or ETA when supported
  - nonessential planner prose, preview diagnostics, and secondary chrome stay collapsed or out of the main guidance view during active navigation
  - stopping navigation or reaching the route end gives the user a clear way to return to the planning state and begin a new route quickly
  - supported browser verification proves the route line remains mostly visible during active navigation and that the user can stop or finish a session and start planning the next route without UI dead ends
verification:
  - npm run verify
  - make run-app
  - supported phone-sized browser walkthrough for active navigation HUD and return-to-planning flow
implementation_notes:
  - "2026-05-15 refine: user feedback clarified that the core phone guidance experience should feel closer to a map-first navigation app and should not leave large diagnostics or planning blocks on screen during navigation."
  - "2026-05-15 refine: the product concept now treats a clean reset into the next planning session as part of the primary journey rather than as optional cleanup after navigation."
