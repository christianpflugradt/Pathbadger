title: Feed live browser position into active navigation
summary: Replace simulated-only active navigation movement with live browser geolocation updates while keeping local route progress and off-route calculations in the frontend.
acceptance_criteria:
  - active navigation can consume live geolocation updates and recompute route progress without backend calls
  - map marker and navigation metrics update from live current position when permission is granted
  - missing or denied geolocation produces an explicit blocked state instead of a synthetic current-position fallback
verification:
  - npm run lint
  - npm run typecheck
  - npm run verify
implementation_notes:
  - "2026-05-13 refine: `ITEM-0020` proved the local instruction and off-route model with simulated state, but current-position following is still unimplemented on real browser location data."
  - "2026-05-13 refine: blocked behind the real-map usability correction, because additional navigation polish carries little product value until the supported local boot shows real self-hosted cartography and the agent workflow can verify it."
  - "2026-05-14 implement: Active navigation now consumes live browser geolocation updates through the existing browser geolocation boundary, recomputes route progress locally from the real current position, and keeps the map marker tied to the live or last-known GPS fix instead of any synthetic navigation fallback."
  - "2026-05-14 implement: Extracted dedicated navigation tracking-state helpers so the execution UI surfaces explicit blocked/error states when permission is denied or the live GPS feed becomes unavailable, even while retaining the last real browser fix for context."
  - "2026-05-14 implement: Added focused coverage in `apps/web/src/navigation-tracking-state.test.ts` plus an additional geolocation subscription test proving the last real GPS fix is retained across later GPS failures, then verified with `npm run verify` and a supported local browser reload at `http://localhost:5173`."
