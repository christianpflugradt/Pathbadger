title: Add a supported routing-capable local boot for navigation checks
summary: Provide and document a supported local app workflow that boots self-hosted GraphHopper alongside the existing map stack so a real routed preview can enter navigation before follow-position behavior is finished.
acceptance_criteria:
  - one documented supported local workflow boots `api`, `web`, `tileserver`, and `graphhopper` together so route previews can succeed in the browser without manual container surgery
  - that routing-capable flow can generate a real route preview with geometry and enter navigation without hidden fixture fallbacks
  - setup docs and command entrypoints distinguish the default map-only boot from the routing-capable flow and explain any required routing data or import limits honestly
verification:
  - npm run verify
  - npm run compose:test
  - supported local routing-capable boot command
  - supported local browser check that a real preview with geometry can start a navigation session
implementation_notes:
  - "2026-05-14 refine: `make run-app` currently wraps `scripts/dev-up.sh`, which only brings up the default compose services. In `docker-compose.yml`, `graphhopper` still lives behind the `maps` profile."
  - "2026-05-14 refine: `apps/web/src/App.tsx` only enables `startNavigation` after a successful or partial preview with geometry, so the default supported boot cannot reach the navigation state that `ITEM-0024` must verify in a real browser."
  - "2026-05-14 refine: the smallest honest next step is to expose and document a supported routing-capable local workflow rather than inventing a fixture-only navigation shortcut inside the user-facing app."
