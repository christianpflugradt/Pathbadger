title: Surface supported place search in the planner
summary: Add a planner search workflow that uses the supported same-origin local place-search boundary to choose start or pass-through points, while keeping empty, unavailable, and out-of-region results explicit in the supported UI.
acceptance_criteria:
  - the planner can search for local places through the supported same-origin boundary and apply a chosen result to the start point or pass-through list
  - the supported UI keeps empty results, unavailable local search, and Schleswig-Holstein-only constraints explicit instead of silently falling back to map-click-only behavior
  - supported browser verification proves the visible planner no longer needs to describe local place search purely as future scope once the search workflow is implemented
verification:
  - npm run verify
  - make run-app
  - supported local browser walkthrough selecting a searched place in the planner
implementation_notes:
  - "2026-05-14 refine: the current planner copy already reserves place search as future scope and keeps the supported UI honest, so the visible search affordance should return only after `ITEM-0041` lands a real same-origin data path."
  - "2026-05-14 refine: the existing map-click start and pass-through model gives this item a clear endpoint: searched places should feed the same coordinate-driven planner state instead of inventing a separate route-request shape."
