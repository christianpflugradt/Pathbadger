  - npm run lint
  - npm run typecheck
implementation_notes:
  - "2026-05-13 refine: `PUBLIC_TILE_STYLE_URL` exists in `docker-compose.yml`, but the web app and docs do not yet treat it as an explicit self-hosted tile-style contract."
  - "2026-05-13 refine: Raised to P0 because it is the smallest map-ui item and makes the future tile-style source explicit before the larger planning-screen shell work lands."
  - "2026-05-13 implement: Added an explicit web runtime config for the self-hosted tile style URL, exposed `PUBLIC_` variables through Vite, and surfaced the resulting tile-style contract in the scaffold UI without implementing the larger planning-screen layout."
  - "2026-05-13 implement: Updated `.env.example`, `README.md`, `docs/operations.md`, and `services/tileserver/README.md` to document that `PUBLIC_TILE_STYLE_URL` must point at a self-hosted style JSON endpoint such as `http://localhost:8080/styles/basic/style.json`."
  - "2026-05-13 implement: Verified with `npm run lint`, `npm run typecheck`, and `npm run verify` after sourcing the repository shell bootstrap instructions."
