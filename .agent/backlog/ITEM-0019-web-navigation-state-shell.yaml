title: Replace the locked navigation handoff with a first execution state
summary: Turn the disabled navigation placeholder into a real execution mode that starts from a routed preview and computes progress locally from route geometry and the geo package.
acceptance_criteria:
  - successful or partial routed previews can enter a navigation state instead of a permanently disabled handoff card
  - execution UI shows current position, completed km, remaining km, total km, and progress percent using `calculateRouteProgress`
  - current route line stays visible while execution state is active without mixing the planning form into route-following logic
verification:
  - npm run lint
  - npm run typecheck
  - npm run verify
implementation_notes:
  - "2026-05-13 refine: `apps/web/src/App.tsx` still renders a locked `Navigation stays separate` card even when a route preview and geometry already exist."
  - "2026-05-13 refine: `packages/geo` now has the first local progress primitive, so the smallest next web execution step is to use it for a navigation shell before layering instruction and off-route behavior on top."
  - "2026-05-13 implement: Added `apps/web/src/navigation-session.ts` and `navigation-session.test.ts` so the web app can derive a simulated current position plus completed, remaining, total, and percent progress from routed geometry via `calculateRouteProgress`."
  - "2026-05-13 implement: Replaced the locked navigation handoff in `apps/web/src/App.tsx` with a real execution card that starts from successful or partial routed previews, pauses planning edits while active, and drives a local follow-progress slider."
  - "2026-05-13 implement: Updated `apps/web/src/PlanningMap.tsx`, `apps/web/src/styles.css`, and the geo/web package manifests so the live map keeps the route line visible during navigation and shows a dedicated current-position marker."
