title: Replace the preview placeholder with a live MapLibre planning map
summary: Mount MapLibre GL JS in the planning screen using the self-hosted style contract so the web UI has a real map surface before routing overlays land.
acceptance_criteria:
  - planning screen renders a live MapLibre map using `PUBLIC_TILE_STYLE_URL`
  - map initialization and cleanup stay behind a small component or hook boundary instead of spreading imperative map code through the page
  - the app shows an honest loading or failure state if the self-hosted style cannot be loaded
verification:
  - npm run lint
  - npm run typecheck
  - npm run verify
implementation_notes:
  - "2026-05-13 refine: `apps/web` still has no `maplibre-gl` dependency and renders a static preview placeholder where the planning map should live."
  - "2026-05-13 implement: Added `maplibre-gl` to the web workspace and introduced `apps/web/src/PlanningMap.tsx` so map initialization, cleanup, and view-centering stay behind a dedicated component boundary instead of spreading imperative code through `App.tsx`."
  - "2026-05-13 implement: Replaced the static preview placeholder with a live MapLibre mount that uses `PUBLIC_TILE_STYLE_URL`, exposes the current planning center, and shows explicit loading or failure copy when the self-hosted style is unavailable."
  - "2026-05-13 implement: Verified with `npm run lint`, `npm run typecheck`, `npm run verify`, and an in-app browser pass at desktop and mobile widths. The local browser check confirmed a mounted `.maplibregl-map` root and an honest `AJAXError` failure state while `http://localhost:8080/styles/basic/style.json` was unreachable."
