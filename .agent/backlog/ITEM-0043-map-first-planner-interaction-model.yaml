id: ITEM-0043
type: feature
priority: P1
status: done
scope: web
origin: refine
parent_epic: EPIC-0018
title: Finish the map-first planner interaction model
summary: Rework the supported planner so the map stays dominant on phone, route settings are collapsible, generated route geometry remains visible while editing, and the primary generate, regenerate, and start actions are obvious near the map.
acceptance_criteria:
  - on a phone-sized supported browser viewport, the planner keeps the map as the dominant surface while selecting start and pass-through points and while inspecting a generated route preview
  - nonessential route details, diagnostics, and helper prose do not persistently cover or push the map out of view during the common planning flow
  - route settings live in a drawer or similarly collapsible surface, while generate route, generate variation, and start navigation remain obvious primary actions near the map
  - supported browser verification proves a user can start from the default Weddelbrook home base, generate a route, inspect the route on the map, optionally regenerate it, and see a clear start-navigation handoff without hunting through the page
verification:
  - npm run verify
  - make run-app
  - supported phone-sized browser walkthrough for start, generate, regenerate, and preview visibility
implementation_notes:
  - "2026-05-15 refine: user feedback clarified that the current product still spends too much space on non-map chrome and hidden or duplicated actions, so the next planner slice must simplify visible controls and keep the route geometry in view."
  - "2026-05-15 refine: optional pass-through points remain important but must stay secondary in the common journey, because many real uses start with only the home-base origin, a distance, and a surface preference."
  - "2026-05-15 implement: the mobile planner chrome now keeps one dominant primary route action near the map, demotes waypoint selection to a smaller utility control, and hides the redundant execution card while planning."
  - "2026-05-15 implement: failed requests from the exact home base at Heidmoorer Straße 18, 24576 Weddelbrook now fall back to a single honest retry action and compact user-facing copy instead of pretending a variation-ready preview still exists."
  - "2026-05-15 implement: item remained open because the supported generator still could not form a legal round course from the exact home-base address, so the acceptance proof for generate, inspect, regenerate, and start-navigation from that default start was still blocked by routing behavior outside this planner-only slice."
  - "2026-05-16 implement: fixed a planner-state bug where `undefined !== null` made a fresh session pretend a preview already existed, which exposed `Generate variation` and `Generate another route` before any routed request was sent."
  - "2026-05-16 implement: collapsed route settings by default on desktop too and merged the duplicate journey card into the map-first preview card so the primary planner actions stay anchored directly to the map stage."
  - "2026-05-16 implement: verified on a rebuilt app with a fresh phone-sized browser context that the Weddelbrook default start now loads with `Generate route`, the first generate returns a route with a clear `Start navigation` handoff, and a failed variation falls back to one honest retry action while keeping the map visible."
