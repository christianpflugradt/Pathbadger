id: ITEM-0047
type: feature
priority: P1
status: done
scope: web
origin: refine
parent_epic: EPIC-0020
title: Build one compact essential navigation HUD
summary: Reduce persistent guidance chrome to one glanceable HUD that exposes only the essential turn and progress metrics during active navigation.
acceptance_criteria:
  - active navigation exposes one visible persistent HUD cluster instead of multiple competing summary cards or panels
  - the compact HUD shows next turn, distance to next turn, km done, km remaining, progress percent, and current speed, while ETA appears only when the existing confidence rules support it
  - duplicate actions, long helper prose, and route-preview summary blocks are removed or collapsed from the active guidance view
  - supported phone-sized browser verification proves the user can glance at the guidance state without losing most of the route behind chrome
verification:
  - npm run verify
  - make run-app
  - supported phone-sized browser walkthrough for active guidance HUD visibility and route visibility
implementation_notes:
  - "2026-05-15 refine: user feedback clarified that the phone navigation HUD should feel closer to a mainstream map guidance view, with only essential metrics visible while moving."
  - "2026-05-15 refine: ETA should remain conditional on reliable speed and progress evidence rather than being forced into the HUD when confidence is weak."
  - "2026-05-16 implement: active guidance now keeps one persistent map HUD cluster with next-turn distance, km done, km left, progress, current speed, and conditional ETA, while GPS and off-route status stay compressed into small pills and one short support line."
  - "2026-05-16 implement: removed the separate active-navigation card from the visible guidance view and repurposed the drawer behind `Navigation settings` so on-demand runtime and orientation controls no longer compete with the route itself."
  - "2026-05-16 implement: verified on a rebuilt app with a phone-sized in-app browser walkthrough that starting navigation leaves only the map, the essential HUD, and the stop/settings controls visible. The same verification confirmed that the drawer now opens guidance settings instead of the full planning form. During browser verification the in-app browser still withheld a usable live GPS fix, so the HUD honestly stayed in its waiting-for-GPS state and ETA remained hidden."
