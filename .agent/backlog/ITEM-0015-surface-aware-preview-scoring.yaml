title: Score routed previews by surface preference and fill honest summaries
summary: Use normalized routed surface data to rank candidates for trail, mixed, asphalt, and indifferent requests while populating honest surface percentages and unknown-coverage warnings in the shared response summary.
acceptance_criteria:
  - scoring tests show observable preference differences for trail, mixed, asphalt, and indifferent requests when routed candidates differ mainly by surface composition
  - route preview summaries populate surface percentage fields or explicit unknown coverage instead of leaving every value null
  - preview warnings distinguish distance-fit issues from incomplete or uncertain surface classification
verification:
  - npm run test
  - npm run typecheck
  - npm run verify
implementation_notes:
  - "2026-05-13 refine: product phase 4 still calls for surface preference mapping and route summary statistics, but the current scorer only ranks by distance fit and treats every non-indifferent request as surface work still pending."
  - "2026-05-13 refine: the next scoring step should stay inside `apps/api/src/routing/routed-candidate-scoring.ts` and `route-generation-service.ts` so the planner can receive richer summaries without changing the request contract again."
  - "2026-05-13 refine: `ITEM-0014` is now done, so routed candidates carry normalized `surfaceDetails` segments from the adapter. The smallest next step is to consume those segments in scoring, populate `RouteSummary.surface` honestly, and replace the placeholder `surface_preference_pending` behavior."
  - "2026-05-13 implement: Reworked `apps/api/src/routing/routed-candidate-scoring.ts` to derive asphalt, trail/unpaved, field-track-other, and unknown percentages from normalized `surfaceDetails`, add a dedicated `surfacePreferenceScore`, and combine that with distance fit for candidate ranking."
  - "2026-05-13 implement: Replaced the placeholder surface warning with `surface_data_incomplete`, so partial previews now distinguish distance misses from uncertain classification while returning honest `RouteSummary.surface` values instead of all-null placeholders."
  - "2026-05-13 implement: Expanded scorer and route-generation tests to prove trail, asphalt, mixed, and indifferent preference behavior, plus updated app and web client fixtures so the shared preview contract reflects real surface summaries and warnings."
