commands:
  vision_reference:
    path: docs/product.md
    usage: review_only
  operational_truth:
    paths:
      - .agent/product.yaml
      - .agent/architecture.yaml
      - .agent/governance.yaml
      - .agent/quality.yaml
      - .agent/testing.yaml
      - .agent/roadmap.yaml
      - .agent/state.yaml
  transaction_model:
    applies_to:
      - refine
      - implement
      - fix
      - review
    commit_policy:
      commit_required_when_files_change: true
      push_when_remote_available: true
      user_may_explicitly_defer_commit: true
    phases:
      - read_state
      - plan_minimal_change
      - apply_change
      - verify
      - update_agent_metadata
      - commit
      - push
      - report
  initial_setup:
    status: completed
    package_manager: npm_only
    next_expected_command: refine
  refine:
    purpose: planning_only
    reads:
      - full_workspace
      - .agent/roadmap.yaml
      - .agent/state.yaml
      - .agent/product.yaml
      - .agent/architecture.yaml
      - .agent/quality.yaml
      - .agent/epics/*
      - .agent/backlog/*
      - .agent/findings/*
    writes:
      - .agent/state.yaml
      - .agent/roadmap.yaml
      - .agent/epics/*
      - .agent/backlog/*
      - .agent/findings/*_only_when_closing_fixed_findings
    code_changes_allowed: trivial_spec_consistency_only
    must:
      - reopen_done_phase_if_supported_local_boot_lacks_core_map_user_value
      - treat_fallback_only_map_states_as_incomplete_not_done
      - inventory_user_visible_placeholders_and_linked_exit_items
      - create_or_refresh_exit_items_for_temporary_placeholders
      - keep_epic_and_phase_incomplete_while_placeholder_exit_items_remain_open
  implement:
    purpose: implement_exactly_one_actionable_backlog_item
    selection_order:
      - p0_items_in_current_epic
      - p1_items_in_current_epic
      - smallest_unblocking_chore
    must:
      - update_tests
      - run_quality_checks
      - do_not_mark_core_map_work_done_without_browser_evidence_from_supported_local_boot
      - do_not_introduce_undeclared_user_visible_fallbacks
      - only_introduce_user_visible_placeholder_when_current_plan_explicitly_tracks_it
      - if_unplanned_placeholder_is_needed_block_the_item_and_send_control_back_to_refine
      - never_mark_placeholder_backed_capability_done_while_its_exit_item_is_open
      - update_item_status
      - stage_and_commit_before_report_unless_user_explicitly_defers_commit
      - push_when_remote_available
  fix:
    purpose: resolve_exactly_one_open_finding
    selection_order:
      - critical_open_findings
      - high_open_findings
      - medium_open_findings
      - low_open_findings
    must:
      - make_smallest_viable_correction_for_one_finding
      - update_tests
      - run_quality_checks
      - do_not_mark_core_map_fix_done_without_browser_evidence_from_supported_local_boot
      - do_not_close_finding_without_verification
      - update_finding_status
      - stage_and_commit_before_report_unless_user_explicitly_defers_commit
      - push_when_remote_available
    must_not:
      - silently_fix_multiple_unrelated_findings
      - rewrite_roadmap
      - close_finding_without_evidence
  review:
    purpose: workspace_audit_and_findings_only
    scope: full_workspace_only
    extra_tokens_are_focus_hints_only: true
    compares_against:
      - .agent/*.yaml
      - docs/product.md
    must:
      - inspect_full_workspace_even_when_focus_hint_is_present
      - collect_browser_or_runtime_evidence_for_core_map_journeys
      - create_high_or_critical_findings_when_supported_local_boot_uses_only_placeholder_or_fallback_cartography
      - create_findings_for_undeclared_user_visible_fallbacks
      - scan_for_user_visible_placeholders_and_verify_linked_exit_items
      - create_high_findings_for_orphaned_placeholders_or_done_state_placeholders
      - never_treat_numeric_review_suffix_as_commit_count
    must_not:
      - update_roadmap_progress
      - create_scope_expansion_without_evidence
      - reinterpret_review_as_commit_or_diff_limited_audit
      - treat_numeric_suffix_as_commit_count_or_patch_limit
  show:
    purpose: brief_workspace_summary_only
    reads:
      - .agent/roadmap.yaml
      - .agent/epics/*
      - .agent/backlog/*
      - .agent/findings/*
    counts:
      open_items: backlog_items_with_status_other_than_done
      incomplete_epics: epics_with_status_other_than_done
      unfixed_findings: findings_with_status_other_than_done_or_accepted_risk
    reports:
      - open_item_count
      - incomplete_epic_count
      - unfixed_finding_count
      - roadmap_overall_progress_percent_from_.agent/roadmap.yaml
    writes: []
    code_changes_allowed: false
    commit_and_push_required: false
