roadmap:
  version: 1
  source:
    operational_specs:
      - .agent/product.yaml
      - .agent/architecture.yaml
      - .agent/governance.yaml
      - .agent/quality.yaml
    vision_reference: docs/product.md
  final_product:
    route_planning_state:
      required_capabilities:
        - see_real_self_hosted_roads_and_trails_on_map_during_supported_planning_boot
        - choose_start_from_map_current_position_or_local_default
        - choose_activity_running_walking_or_cycling
        - enter_target_distance_in_km
        - choose_surface_preference_trail_mixed_asphalt_or_indifferent
        - add_optional_pass_through_points
        - generate_one_random_route_candidate
        - regenerate_a_new_variation
        - inspect_distance_surface_and_warning_summary
        - see_clear_feedback_for_unroutable_or_too_long_requests
    route_execution_state:
      required_capabilities:
        - view_route_geometry_on_map
        - follow_current_position
        - inspect_next_instruction_and_distance
        - see_completed_remaining_total_distance
        - see_current_speed_average_speed_and_progress_percent
        - receive_off_route_warning
        - use_north_up_navigation_by_default
    platform_and_operations:
      required_capabilities:
        - npm_only_monorepo_workflow
        - self_hosted_graphhopper_service
        - self_hosted_tile_service
        - supported_local_boot_for_real_self_hosted_map_journeys
        - docker_compose_orchestrated_stack
        - automated_lint_typecheck_test_and_compose_validation
        - durable_agent_roadmap_backlog_and_review_state
      constraints:
        - Schleswig-Holstein_only
        - kilometers_and_kmh_only
        - no_accounts
        - no_route_library
        - no_registration_required_dependencies
  overall_progress_percent: 74
  phases:
    - id: foundation
      title: Repository, specs, tooling, Docker skeleton
      status: done
      progress_percent: 100
      target_outcome: verified npm-only monorepo foundation with agent workflow and reproducible checks
    - id: routing-core
      title: Self-hosted GraphHopper routing for Schleswig-Holstein
      status: planned
      progress_percent: 70
      target_outcome: GraphHopper-backed routing adapter with legal request handling and mocked tests
    - id: map-ui
      title: MapLibre map UI and route display
      status: done
      progress_percent: 100
      target_outcome: browser-verified planning map with real self-hosted cartography and route preview
    - id: route-generation
      title: Random route generation, scoring, distance handling
      status: done
      progress_percent: 100
      target_outcome: candidate generation and scoring that match distance and surface preferences honestly
    - id: navigation
      title: GPS route following and navigation metrics
      status: active
      progress_percent: 60
      target_outcome: mobile-friendly outdoor navigation with local progress calculations
    - id: hardening
      title: QA, energy behavior, security, docs, operations
      status: planned
      progress_percent: 0
      target_outcome: stable self-hosted operation with honest warnings and conservative battery behavior
  current_epic: EPIC-0010
  completed_summary:
    - npm-only monorepo scaffolding, agent specs, docs, and hooks were created during initial setup
    - npm run verify currently passes lint, typecheck, unit tests, and formatting checks
    - npm run compose:test now builds and boots the api, web, and tileserver containers, verifies the api health endpoint and the self-hosted style endpoint, and tears the stack down again
    - api, web, shared, and geo packages all have typed starter scaffolds that compile cleanly
    - shared route-generation contracts and a mocked GraphHopper adapter boundary are in place for future api route work
    - the web app and docs now expose an explicit self-hosted tile-style contract through `PUBLIC_TILE_STYLE_URL`
    - the web planning shell now renders route-request controls, shared request previews, and a separate navigation handoff without mixing execution state into planning
    - the planning screen now mounts a live self-hosted MapLibre surface and reports explicit loading or fetch-failure states instead of a static map placeholder
    - the live planning map now drives the map-selected start and pass-through list, so planner state is synced to real map clicks instead of placeholder coordinates
    - the api now derives deterministic candidate waypoint seeds from planning inputs, preserving pass-through order and stable random-seed behavior for later routed preview work
    - the api now exposes `POST /routes/generate` with shared request validation, honest preview status mapping, and browser-safe local CORS handling
    - the web planner now calls backend preview generation, renders routed warnings and summary state, and can draw response geometry on the live planning map when the backend provides it
    - the api now scores routed preview candidates in a dedicated boundary and selects the best available candidate across deterministic seeds instead of accepting the first routed result
    - the GraphHopper adapter now requests route path details and normalizes routed surface segments into an internal `surfaceDetails` shape with an honest unknown fallback when live detail data is missing
    - routed preview scoring now accounts for trail, mixed, asphalt, and indifferent surface preferences while filling honest surface percentage summaries and incomplete-data warnings
    - the planner now renders routed surface composition cards and unknown-coverage messaging, so surface-aware route previews are visible end to end in the web UI
    - the default local app workflow now includes `make run-app`, `make stopp-app`, and `make rebuild-app`, with docs aligned to the compose-based browser startup flow
    - the planning map now fails honestly when the configured self-hosted style is missing or unreachable instead of drawing bundled fallback cartography
    - the supported local app boot now auto-generates ignored map data under `data/tiles/`, starts the self-hosted tile service by default, and passes the live browser smoke on a real Bad Bramstedt-centered planning map
    - "`packages/geo` now exports `calculateRouteProgress`, giving later navigation UI a tested local primitive for snapped route position, completed distance, remaining distance, progress fraction, and off-route distance"
    - route previews now carry normalized instruction arrays end to end from GraphHopper through the shared response contract and into the web app
    - the web app can now start a first local navigation session from a routed preview, compute progress locally, show next-instruction cues, and surface conservative off-route warnings without backend polling
    - active navigation now consumes live browser geolocation when it is available, retains the last real GPS fix during later feed failures, and surfaces explicit blocked/error GPS states instead of inventing a synthetic current-position fallback
    - the execution UI now surfaces current speed and timestamp-based average speed in km/h when browser geolocation data supports them, while keeping null or stale speed readings explicitly unavailable
  remaining_summary:
    - the supported local boot now shows real self-hosted roads and trails through the default Bad Bramstedt starter slice, while `PATHBADGER_TILE_DATA_SCOPE=schleswig_holstein` is the heavier whole-state configuration for broader live-map use
    - routing-core and route-generation now reach an honest preview loop with surface-aware summaries and instruction data, but live GraphHopper route quality against a prepared Schleswig-Holstein graph is still proven mostly through mocked coverage
    - active navigation now follows live browser geolocation in the frontend, but the default supported local boot still stops at `api`, `web`, and `tileserver`, so browser-level proof of route execution lacks a supported routed-preview entry path while `graphhopper` remains behind the `maps` profile
    - "`ITEM-0027` now comes before `ITEM-0024`: first expose and document a supported routing-capable local boot that can start a real navigation session, then add manual-pan follow escape plus an explicit recenter control on top of that honest browser path"
