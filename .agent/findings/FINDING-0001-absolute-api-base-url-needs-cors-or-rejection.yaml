id: FINDING-0001
status: open
severity: medium
category: correctness
title: Absolute browser API URLs no longer work after CORS removal
evidence:
  - apps/web/src/config.ts accepts any PUBLIC_API_BASE_URL and apps/web/src/route-preview-client.test.ts explicitly documents absolute API base URLs as supported.
  - apps/web/src/route-preview-client.ts always sends a JSON POST to /routes/generate, which triggers a browser CORS preflight for cross-origin API bases.
  - apps/api/src/app.ts no longer handles OPTIONS requests or emits access-control-allow-origin, access-control-allow-methods, or access-control-allow-headers.
impact: Browser deployments that set PUBLIC_API_BASE_URL to an absolute origin now fail at preflight time even though the client and tests still advertise that mode as supported.
recommendation: Either restore configurable CORS and OPTIONS handling in the API for supported cross-origin deployments, or reject and document only same-origin /api values so the client cannot advertise a broken mode.
acceptance_criteria:
  - Cross-origin PUBLIC_API_BASE_URL values either work end-to-end in a real browser or are explicitly rejected and documented as unsupported.
  - Automated coverage prevents the client from continuing to advertise unsupported absolute browser API URLs.
verification:
  - npm test
  - npm run compose:test
