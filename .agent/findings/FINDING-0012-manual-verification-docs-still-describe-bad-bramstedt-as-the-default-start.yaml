title: Manual verification docs still describe Bad Bramstedt as the default start after the product spec moved to Weddelbrook
evidence:
  - "The durable product specs now define the canonical default start as `Heidmoorer Straße 18, 24576 Weddelbrook` in `.agent/product.yaml` and `docs/product.md`."
  - "`docs/operations.md` still tells manual route-quality reviewers to `use the default Bad Bramstedt starter area` for browser capture."
  - "`docs/routing.md` still says `Keep the default Bad Bramstedt starter area` in the supported browser walkthrough."
  - "`.agent/roadmap.yaml` still summarizes the supported planning map as a `real Bad Bramstedt-centered planning map`, which no longer matches the canonical default start now used to steer future work."
impact: Future agents and reviewers can collect evidence against the wrong default journey and may continue designing around the older Bad Bramstedt-centered assumption instead of the now-explicit Weddelbrook home-base workflow.
recommendation: Align the remaining operational docs and roadmap summary language with the canonical Weddelbrook default start, while preserving any historical implementation notes that intentionally describe earlier milestones.
acceptance_criteria:
  - Current operational docs that describe the default manual verification journey use the Weddelbrook home-base start instead of the older Bad Bramstedt default wording.
  - The roadmap's current-state summaries no longer describe the active default planner journey as Bad Bramstedt-centered.
  - Historical item notes may still mention earlier Bad Bramstedt milestones, but current guidance is clearly separated from that history.
verification:
  - make show
  - manual spec review of .agent/product.yaml, .agent/roadmap.yaml, docs/operations.md, and docs/routing.md
