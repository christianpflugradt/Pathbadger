product:
  name: pathbadger
  purpose: spontaneous self-hosted route generation and route following for running and cycling in Schleswig-Holstein
  region: Schleswig-Holstein
  users:
    - private_single_user
  activities:
    - running_walking
    - cycling
  units:
    distance: km
    speed: kmh
  defaults:
    start_point:
      label: Heidmoorer Straße 18, 24576 Weddelbrook
      lat: 53.9015262
      lon: 9.8325138
      applies_when: no_user_selected_or_locally_restored_start_exists
    route_generation:
      shape: round_trip
      must_return_to_start: true
      prefer_zero_bidirectional_overlap: true
      maximum_bidirectional_overlap_meters: 500
      maximum_target_distance_delta_meters: 400
      normal_goal: within_a_few_hundred_meters_of_target_distance
  canonical_user_workflow:
    - the common journey begins from the default Weddelbrook home-base start unless the user picks another supported start or a remembered local start overrides it
    - the user usually sets only a start point, target distance, and surface preference before generating a route
    - optional pass-through points are important but secondary, and the common flow must still feel complete without them
    - every generated route is a round course that starts and ends at the same point rather than a point-to-point trip
    - a real round course should avoid running the same path in both directions; repeated-path overlap should ideally be zero and must stay below 500 meters total
    - generate route and generate another variation are the primary planning actions
    - a normal generated route should stay within a few hundred meters of the target distance, with 400 meters as the hard outer limit for an acceptable default result
    - start navigation is the primary handoff once an acceptable route preview is visible on the map
    - starting navigation should switch the same map into a dedicated guidance mode rather than leaving the user inside a planner or diagnostics-heavy shell
    - after the route is finished or manually stopped, the user should be able to return quickly to planning and begin a new route
  experience_principles:
    - the map is the center of the product during both planning and navigation
    - on phone the map should occupy roughly 80 percent or more of the viewport during planning and active guidance whenever practical
    - route settings should live in a drawer or other collapsible chrome so the generated route stays visible
    - persistent nonessential popups or prose must not cover the map during the core journey
    - active guidance overlays must stay terse and route-relevant, with no generic confidence explanations, no large popup cards, and no filler copy in the primary maneuver banner
    - generate route, generate variation, and start navigation must be obvious without requiring the user to read long explanatory text
    - the generated route should remain mostly visible while the user adjusts parameters, inspects the preview, or follows navigation cues
    - active navigation should feel like a dedicated guidance mode, not a planner or debug page layered on top of the map
    - active guidance should use one compact essential HUD cluster rather than multiple competing panels
  non_goals:
    - user_accounts
    - authentication
    - multi_user_route_libraries
    - social_sharing
    - route_marketplace
    - route_import
    - route_management_ui
    - route_notes
    - route_ratings
    - favorite_roads_or_trails
    - reverse_route
    - cloud_provider_dependency
    - paid_map_apis
    - global_routing
    - native_mobile_app
    - voice_navigation
  feature_groups:
    route_planning:
      - real_self_hosted_cartography_visible_during_planning
      - default_home_start_in_weddelbrook_until_user_override
      - start_point_from_map_click
      - optional_current_position_start
      - locally_remembered_default_start
      - locally_remembered_last_start
      - activity_selection
      - target_distance_km
      - round_trip_route_returns_to_same_start
      - round_trip_avoids_bidirectional_overlap_except_short_connectors_under_500_meters
      - normal_route_distance_delta_stays_within_400_meters
      - surface_preference_selection
      - common_planning_flow_works_without_pass_through_points
      - optional_pass_through_points
      - map_first_planning_layout_with_route_visible
      - collapsible_route_settings_while_map_stays_visible
      - generate_single_route_candidate
      - generate_another_variation
      - obvious_generate_regenerate_and_start_navigation_actions
      - route_summary_with_distance_surface_and_warnings
      - elevation_gain_when_available
      - impossible_or_too_long_route_handling_with_explicit_feasibility_warning
    navigation:
      - route_line_visible
      - current_position_visible
      - map_dominates_phone_viewport_during_guidance
      - direct_navigation_mode_handoff_from_route_preview
      - follow_position_default_behavior
      - north_indicator_or_compass_indicator
      - single_compact_navigation_hud_cluster
      - planner_preview_and_diagnostic_chrome_hidden_during_guidance
      - minimal_navigation_hud_with_turn_progress_and_speed
      - next_instruction_and_distance
      - completed_remaining_total_km
      - progress_percent
      - current_and_average_speed
      - estimated_remaining_time_when_feasible
      - off_route_warning
      - north_up_mode
      - optional_heading_up_mode
      - quick_return_to_planning_after_navigation
    settings:
      - local_storage_for_last_activity
      - local_storage_for_surface_preference
      - local_storage_for_default_start
      - local_storage_for_last_start
      - battery_runtime_mode
    diagnostics:
      - hard_failure_when_required_map_style_unavailable
      - explicit_temporary_placeholder_labeling_when_capability_unfinished
      - no_user_visible_fallbacks_without_explicit_product_design
      - honest_surface_unknown_reporting
      - out_of_region_warning_or_rejection
      - routing_engine_unavailable_error
      - invalid_request_error
      - data_missing_error
