id: EPIC-0017
status: open
phase: post-mvp-place-search
title: Add self-hosted place search support
objective: extend the supported planner beyond map-click-only waypoint discovery by adding a same-origin self-hosted place-search path for start and pass-through selection, without introducing third-party browser dependencies or misleading placeholder behavior
success_criteria:
  - the repo exposes a supported same-origin local place-search boundary that fits the self-hosted no-registration architecture and fails honestly when search data or provider behavior is unavailable
  - the planner can use that supported boundary to search and select places for start or pass-through points instead of relying only on manual map clicks
  - docs and supported UI copy stay honest about what the place-search flow can and cannot do locally, without reintroducing orphaned placeholder controls
