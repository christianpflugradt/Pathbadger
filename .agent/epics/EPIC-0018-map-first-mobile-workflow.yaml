title: Finish the map-first planner workflow
objective: encode and finish the intended planning journey where the map stays central while selecting starts and optional pass-through points, route settings stay collapsible, and generate, regenerate, and start-navigation actions remain obvious near the route preview
success_criteria:
  - the supported planner keeps the map as the dominant surface on phone while selecting starts, optional pass-through points, and generated route previews
  - generate route, generate variation, and start navigation are obvious primary actions near the map and do not require the user to read long explanatory copy or hunt through the page
  - starting navigation from the planner gives the user a clear direct handoff into the separate active-guidance mode instead of leaving the route preview flow ambiguous
