services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      API_PORT: ${API_PORT:-3001}
      REGION_NAME: ${REGION_NAME:-Schleswig-Holstein}
      GRAPHHOPPER_URL: ${GRAPHHOPPER_URL:-http://graphhopper:8989}
      TILESERVER_URL: ${TILESERVER_URL:-http://tileserver:8080}
    ports:
      - "${API_PORT:-3001}:3001"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://localhost:3001}
      PUBLIC_TILE_STYLE_URL: ${PUBLIC_TILE_STYLE_URL:-http://localhost:8080/styles/basic/style.json}
      REGION_NAME: ${REGION_NAME:-Schleswig-Holstein}
    depends_on:
      - api
    ports:
      - "5173:5173"

  graphhopper:
    image: graphhopper/graphhopper:latest
    profiles:
      - maps
    environment:
      JAVA_OPTS: "-Xms512m -Xmx1024m"
    ports:
      - "8989:8989"
    volumes:
      - ./data/osm:/data/osm
      - ./data/graphhopper:/data/graphhopper
      - ./services/graphhopper/config.yml:/config/config.yml:ro
      - ./services/graphhopper/custom-models:/custom-models:ro

  tileserver:
    image: maptiler/tileserver-gl:latest
    profiles:
      - maps
    ports:
      - "8080:8080"
    volumes:
      - ./data/tiles:/data
      - ./services/tileserver/config.json:/config/config.json:ro
