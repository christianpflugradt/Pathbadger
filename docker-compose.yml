services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      API_PORT: ${API_PORT:-3001}
      REGION_NAME: ${REGION_NAME:-Schleswig-Holstein}
      GRAPHHOPPER_URL: ${GRAPHHOPPER_URL:-http://graphhopper:8989}
      GRAPHHOPPER_HAS_ELEVATION: ${GRAPHHOPPER_HAS_ELEVATION:-false}
      TILESERVER_URL: ${TILESERVER_URL:-http://tileserver:8080}
    expose:
      - "3001"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      PATHBADGER_API_UPSTREAM: ${PATHBADGER_API_UPSTREAM:-http://api:3001}
      PATHBADGER_TILESERVER_UPSTREAM: ${PATHBADGER_TILESERVER_UPSTREAM:-http://tileserver:8080}
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-/api}
      PUBLIC_REGION_NAME: ${REGION_NAME:-Schleswig-Holstein}
      PUBLIC_TILE_STYLE_URL: ${PUBLIC_TILE_STYLE_URL:-/styles/basic/style.json}
    depends_on:
      - api
      - tileserver
    ports:
      - "5173:5173"

  graphhopper:
    image: israelhikingmap/graphhopper:latest
    profiles:
      - maps
    environment:
      JAVA_OPTS: "${GRAPHHOPPER_JAVA_OPTS:--Xms512m -Xmx1024m}"
    command:
      - -i
      - ${GRAPHHOPPER_OSM_FILE:-/data/osm/schleswig-holstein-latest.osm.pbf}
      - -o
      - ${GRAPHHOPPER_GRAPH_CACHE:-/data/graphhopper/cache}
      - -c
      - ${GRAPHHOPPER_CONFIG_PATH:-/config/config.yml}
      - --host
      - 0.0.0.0
    expose:
      - "8989"
    volumes:
      - ./data/osm:/data/osm
      - ./data/graphhopper:/data/graphhopper
      - ./services/graphhopper/config.yml:/config/config.yml:ro
      - ./services/graphhopper/config-elevation.yml:/config/config-elevation.yml:ro
      - ./services/graphhopper/custom-models:/custom-models:ro

  tileserver:
    build:
      context: .
      dockerfile: services/tileserver/Dockerfile
    environment:
      PATHBADGER_TILE_DATA_FILE: ${PATHBADGER_TILE_DATA_FILE:-}
      PATHBADGER_TILE_DATA_SCOPE: ${PATHBADGER_TILE_DATA_SCOPE:-starter}
    expose:
      - "8080"
    volumes:
      - ./data/tiles:/runtime-data
