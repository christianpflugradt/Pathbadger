graphhopper:
  datareader.file: /data/osm/schleswig-holstein-latest.osm.pbf
  graph.location: /data/graphhopper/cache
  import.osm.ignored_highways: motorway,trunk
  profiles:
    - name: foot
      custom_model_files: [foot.json]
    - name: bike
      custom_model_files: [bike.json]
  profiles_ch: []
  profiles_lm: []
  graph.encoded_values: |
    foot_access, foot_average_speed, foot_priority, foot_road_access, hike_rating,
    bike_access, bike_average_speed, bike_priority, bike_road_access, bike_network,
    road_class, roundabout, surface, mtb_rating, road_environment, ferry_speed
server:
  application_connectors:
    - type: http
      port: 8989
